# Hand-authored reference capability used by the test-suite (independent of discovery output).
schema_version: 1
capability:
  id: demo_bank.lookup_balance
  version: 1.0.0
  summary: Look up a member by ID and read their savings balance
  app: {product: demo-core-banking, product_version: "3.4", surface: web}
  status: approved
  provenance: {reviewed_by: test-author}
inputs:
  member_id: {type: string, pattern: '^\d{5}$', sensitivity: pii, description: Five-digit member number}
outputs:
  savings_balance: {type: decimal, sensitivity: financial, from_step: s3, description: Current savings balance}
requires: [session.authenticated]
steps:
  - id: s1
    intent: Enter the member ID in the search form
    action: fill
    target:
      frame: [main]
      strategies:
        - {by: adjacent_label, text: "Member ID:", control: input}
        - {by: css, value: "body > font:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(2) > td:nth-of-type(1) > form:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(1) > td:nth-of-type(2) > input:nth-of-type(1)"}
      fingerprint: {tag: input, type: text, role: textbox, name: Member ID}
    value: "{{inputs.member_id}}"
  - id: s2
    intent: Run the search
    action: click
    target:
      frame: [main]
      strategies:
        - {by: role, role: button, name: Search}
      fingerprint: {tag: input, type: submit, role: button, name: Search}
    expect: {timeout_ms: 10000, text_visible: Member Detail}
  - id: s3
    intent: Read the savings balance
    action: extract
    output: savings_balance
    target:
      frame: [main]
      strategies:
        - {by: table_cell, row: Savings, column: Balance}
        - {by: css, value: "body > font:nth-of-type(1) > table:nth-of-type(1) > tbody:nth-of-type(1) > tr:nth-of-type(2) > td:nth-of-type(1) > table:nth-of-type(2) > tbody:nth-of-type(1) > tr:nth-of-type(2) > td:nth-of-type(3)"}
      fingerprint: {tag: td, role: cell}
outcomes:
  - code: MEMBER_NOT_FOUND
    kind: business
    when: {text_visible: No member found}
    message: No member matches the given ID.
    steps: [s2]
success: {text_visible: Member Detail}
